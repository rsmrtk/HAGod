# What a client sees: one address for writes, one for reads. HAProxy asks Patroni's
# REST API which node is the primary (HTTP 200 on /primary) and which are replicas.
global
    maxconn 500
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    retries 2
    timeout connect 3s
    timeout client  30m
    timeout server  30m
    timeout check   2s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 2s

# 5000 = read/write: only the node that answers 200 to GET /primary
listen postgres_primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008

# 5001 = read only: nodes that answer 200 to GET /replica, round robin
listen postgres_replicas
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008
