global: {scrape_interval: 5s, evaluation_interval: 5s}
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: patroni           # Patroni's own REST API serves /metrics
    metrics_path: /metrics
    static_configs: [{targets: ["pg1:8008", "pg2:8008", "pg3:8008"]}]
  - job_name: etcd
    static_configs: [{targets: ["etcd1:2379", "etcd2:2379", "etcd3:2379"]}]
  - job_name: postgres          # postgres_exporter asks the primary behind HAProxy
    static_configs: [{targets: ["pg-exporter:9187"]}]
  - job_name: redis             # one exporter, three targets (multi-target mode)
    metrics_path: /scrape
    static_configs: [{targets: ["redis://redis1:6379", "redis://redis2:6379", "redis://redis3:6379"]}]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "redis-exporter:9121"}
