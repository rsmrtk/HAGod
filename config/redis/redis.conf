# Shared by redis1..3. Replication role is decided at start-up by redis-entrypoint.sh.
port 6379
bind 0.0.0.0
protected-mode no
dir /data

requirepass hagod-redis
masterauth  hagod-redis

# persistence: RDB snapshots + AOF (everysec = lose at most ~1 s on a crash)
save 60 1000
appendonly yes
appendfsync everysec

# replication
replica-read-only yes
repl-diskless-sync yes
repl-backlog-size 8mb
# Drill 12 turns these on: refuse writes when fewer than N replicas are in sync.
min-replicas-to-write 0
min-replicas-max-lag 10

# memory (drill 11 lowers it to watch eviction)
maxmemory 256mb
maxmemory-policy noeviction

# LAB ONLY: lets drill 15 use DEBUG SLEEP (never enable this in production)
enable-debug-command yes
slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 100
