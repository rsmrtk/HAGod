port 26379
bind 0.0.0.0
protected-mode no
dir /data

# sentinels are protected too; they authenticate to each other with sentinel-pass
requirepass hagod-redis
sentinel sentinel-pass hagod-redis

# Monitor the master by IP. With hostnames Sentinel resolves DNS inside its single event loop: when the name
# stops resolving (a network partition!) every attempt blocks it, it enters TILT and stops failing over.
sentinel monitor mymaster 172.30.0.11 6379 2
sentinel auth-pass mymaster hagod-redis
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 15000
sentinel parallel-syncs mymaster 1
